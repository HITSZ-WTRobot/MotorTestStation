[package]
name = "motor-test-station"
version = "2.4.0"
description = "STM32 Motor Test & Closed-Loop Torque Telemetry Workstation"
authors = ["MotorTestStation"]
edition = "2021"

[lib]
name = "motor_test_station_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = [] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
serialport = "4.7"
