name: Release Portable Binaries & Web HTML

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build-binaries:
    strategy:
      fail-fast: false
      matrix:
        include:
          - platform: windows-latest
            artifact_name: MotorTestStation-Windows-x64.exe
            build_cmd: npm run build:desktop
            binary_src: src-tauri/target/release/motor-test-station.exe

          - platform: ubuntu-22.04
            artifact_name: MotorTestStation-Linux-x64
            build_cmd: npm run build:desktop
            binary_src: src-tauri/target/release/motor-test-station

          - platform: macos-latest
            artifact_name: MotorTestStation-macOS
            build_cmd: npm run build:desktop
            binary_src: src-tauri/target/release/motor-test-station

    runs-on: ${{ matrix.platform }}
    steps:
      - uses: actions/checkout@v4

      - name: Install Linux system dependencies
        if: matrix.platform == 'ubuntu-22.04'
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev libappindicator3-dev librsvg2-dev patchelf libudev-dev pkg-config

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: 'npm'

      - name: Setup Rust stable
        uses: dtolnay/rust-toolchain@stable

      - name: Install frontend dependencies
        run: npm ci

      - name: Build standalone portable binary
        run: ${{ matrix.build_cmd }}

      - name: Prepare binary artifact
        shell: bash
        run: |
          mkdir -p artifacts
          cp "${{ matrix.binary_src }}" "artifacts/${{ matrix.artifact_name }}"
          if [ "${{ matrix.platform }}" != "windows-latest" ]; then
            chmod +x "artifacts/${{ matrix.artifact_name }}"
          fi

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: binary-${{ matrix.platform }}
          path: artifacts/*

  publish-release:
    needs: build-binaries
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: 'npm'

      - name: Install dependencies & build modern web dist
        run: |
          npm ci
          npm run build:web
          cd dist && zip -r ../MotorTestStation-Web-Dist.zip . && cd ..

      - name: Download all platform binaries
        uses: actions/download-artifact@v4
        with:
          path: downloaded_artifacts
          merge-multiple: true

      - name: Prepare release assets
        run: |
          mkdir -p release_assets
          cp downloaded_artifacts/* release_assets/ || true
          cp web/index.html release_assets/MotorTestStation-Web-Standalone.html
          cp "web/串口.html" release_assets/串口.html
          cp MotorTestStation-Web-Dist.zip release_assets/
          ls -la release_assets/

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          name: "Motor Test Station Pro ${{ github.ref_name }} (免安装绿色便携版)"
          body: |
            ### 🚀 Motor Test Station Pro ${{ github.ref_name }} 免安装直接运行版

            本版本所有产物均为**打开即用、无需安装向导的独立便携版 (Portable)**：

            - 🪟 **Windows 绿色独立版**：`MotorTestStation-Windows-x64.exe`（直接双击即可运行，无需安装，无捆绑）
            - 🐧 **Linux 便携独立版**：`MotorTestStation-Linux-x64`（赋予执行权限 `chmod +x` 后直接运行）
            - 🍎 **macOS 便携独立版**：`MotorTestStation-macOS`（直接运行）
            - 🌐 **纯网页独立版**：`MotorTestStation-Web-Standalone.html` / `串口.html`（零依赖，直接用 Chrome / Edge 打开即可连机）
            - 📦 **现代 Web 静态站点压缩包**：`MotorTestStation-Web-Dist.zip`（可直接解压部署到静态服务器或 GitHub Pages）
          draft: false
          prerelease: false
          files: release_assets/*
